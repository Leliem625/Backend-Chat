spring.application.name=demo
server.port=${SERVER_PORT:8081}

# ========================================================
# CẤU HÌNH DATABASE MYSQL (Đọc trực tiếp từ file .env)
# ========================================================
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Cấu hình Hibernate / JPA (Tự động đồng bộ Table từ Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================================================
# CẤU HÌNH JWT
# ========================================================
jwt.secret=${JWT_SECRET:123456}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================================================
# CẤU HÌNH GỬI EMAIL (GMAIL SMTP)
# ========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ========================================================
# CẤU HÌNH UPLOAD FILE (CLOUDINARY)
# ========================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ========================================================
# CẤU HÌNH SOCKET.IO
# ========================================================
socket.port=${SOCKET_PORT:9092}
